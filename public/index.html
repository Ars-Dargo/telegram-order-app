<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Fabrista чек/стоп лист</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div id="app">

    <!-- Loading -->
    <div id="loading">
      <div class="spinner"></div>
      <p>Загрузка...</p>
    </div>

    <!-- Home screen -->
    <div id="home-screen" class="hidden">

      <!-- Orange hero -->
      <div class="home-hero">
        <!-- Bunny mascot watermark -->
        <svg class="home-hero-mascot" viewBox="0 0 120 90" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="38" cy="17" rx="7" ry="22" transform="rotate(-12 38 17)"/>
          <ellipse cx="54" cy="15" rx="7" ry="21" transform="rotate(10 54 15)"/>
          <ellipse cx="45" cy="42" rx="19" ry="17"/>
          <ellipse cx="74" cy="61" rx="28" ry="17" transform="rotate(-8 74 61)"/>
          <circle cx="100" cy="52" r="9"/>
          <ellipse cx="49" cy="76" rx="6" ry="10" transform="rotate(-20 49 76)"/>
          <ellipse cx="77" cy="77" rx="7" ry="11" transform="rotate(22 77 77)"/>
        </svg>
        <div class="home-hero-text">
          <h1 class="home-title">Fabrista</h1>
          <p class="home-subtitle">чек/стоп лист</p>
        </div>
      </div>

      <!-- Menu buttons with mascots -->
      <div class="home-menu">

        <!-- Курица — Заказ еды -->
        <button id="food-order-btn" class="home-btn">
          <span class="home-btn-mascot">
            <svg viewBox="0 0 44 30" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <circle cx="8" cy="5" r="3.5"/>
              <circle cx="14" cy="3" r="3.5"/>
              <circle cx="20" cy="5" r="3.5"/>
              <circle cx="14" cy="13" r="8"/>
              <ellipse cx="30" cy="19" rx="15" ry="11"/>
              <ellipse cx="43" cy="13" rx="5" ry="7" transform="rotate(20 43 13)"/>
              <circle cx="11" cy="11" r="2" fill="white"/>
              <ellipse cx="23" cy="28" rx="4" ry="3"/>
              <ellipse cx="35" cy="28" rx="4" ry="3"/>
            </svg>
          </span>
          <span class="home-btn-label">Заказ еды</span>
        </button>

        <!-- Крокодил — Заказ десертов -->
        <button id="order-flow-btn" class="home-btn">
          <span class="home-btn-mascot">
            <svg viewBox="0 0 44 26" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="8" cy="10" rx="8" ry="4"/>
              <rect x="2" y="12" width="16" height="6" rx="2"/>
              <ellipse cx="28" cy="15" rx="16" ry="9"/>
              <path d="M42,11 Q46,14 43,17 Q40,15 42,11z"/>
              <ellipse cx="19" cy="22" rx="4" ry="3.5"/>
              <ellipse cx="30" cy="23" rx="4" ry="3.5"/>
              <circle cx="5" cy="10" r="1.8" fill="white"/>
            </svg>
          </span>
          <span class="home-btn-label">Заказ десертов</span>
        </button>

        <!-- Панголин — О десертах -->
        <button id="info-flow-btn" class="home-btn home-btn-outline">
          <span class="home-btn-mascot">
            <svg viewBox="0 0 44 28" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="26" cy="18" rx="18" ry="12"/>
              <ellipse cx="8" cy="19" rx="10" ry="6" transform="rotate(-10 8 19)"/>
              <path d="M20,9 Q24,3 28,9" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
              <path d="M29,7 Q33,1 37,7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
              <ellipse cx="22" cy="25" rx="4" ry="3.5"/>
              <ellipse cx="33" cy="25" rx="4" ry="3.5"/>
              <circle cx="4" cy="17" r="1.8" fill="white"/>
            </svg>
          </span>
          <span class="home-btn-label">О десертах</span>
        </button>

        <!-- Курица — О еде -->
        <button id="food-info-btn" class="home-btn home-btn-outline">
          <span class="home-btn-mascot">
            <svg viewBox="0 0 44 30" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <circle cx="8" cy="5" r="3.5"/>
              <circle cx="14" cy="3" r="3.5"/>
              <circle cx="20" cy="5" r="3.5"/>
              <circle cx="14" cy="13" r="8"/>
              <ellipse cx="30" cy="19" rx="15" ry="11"/>
              <ellipse cx="43" cy="13" rx="5" ry="7" transform="rotate(20 43 13)"/>
              <circle cx="11" cy="11" r="2" fill="white"/>
              <ellipse cx="23" cy="28" rx="4" ry="3"/>
              <ellipse cx="35" cy="28" rx="4" ry="3"/>
            </svg>
          </span>
          <span class="home-btn-label">О еде</span>
        </button>

        <!-- Бегемот — История заказов -->
        <button id="history-flow-btn" class="home-btn home-btn-outline">
          <span class="home-btn-mascot">
            <svg viewBox="0 0 44 28" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="27" cy="19" rx="17" ry="11"/>
              <ellipse cx="13" cy="15" rx="13" ry="10"/>
              <ellipse cx="8" cy="10" rx="7" ry="5"/>
              <circle cx="21" cy="8" r="4"/>
              <circle cx="27" cy="7" r="4"/>
              <circle cx="18" cy="11" r="2" fill="white"/>
              <circle cx="9" cy="11" r="2" fill="white"/>
              <ellipse cx="20" cy="27" rx="5" ry="3.5"/>
              <ellipse cx="33" cy="27" rx="5" ry="3.5"/>
            </svg>
          </span>
          <span class="home-btn-label">История заказов</span>
        </button>

        <!-- Зайчик — Открытие смены -->
        <button id="checklist-flow-btn" class="home-btn home-btn-outline">
          <span class="home-btn-mascot">
            <svg viewBox="0 0 44 34" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="14" cy="9" rx="5" ry="12" transform="rotate(-10 14 9)"/>
              <ellipse cx="22" cy="8" rx="5" ry="12" transform="rotate(8 22 8)"/>
              <ellipse cx="17" cy="22" rx="10" ry="9"/>
              <ellipse cx="33" cy="27" rx="12" ry="8" transform="rotate(-5 33 27)"/>
              <circle cx="43" cy="24" r="5"/>
              <ellipse cx="20" cy="32" rx="4" ry="5" transform="rotate(-15 20 32)"/>
              <ellipse cx="35" cy="33" rx="4" ry="5" transform="rotate(15 35 33)"/>
            </svg>
          </span>
          <span class="home-btn-label">Открытие смены ✓</span>
        </button>

      </div>
    </div>

    <!-- Location selection -->
    <div id="location-screen" class="hidden fullscreen-panel">
      <div class="panel-header">
        <button id="loc-back-btn">← Назад</button>
        <h2>Выберите точку</h2>
      </div>
      <div id="location-list"></div>
      <div class="bottom-actions">
        <button id="loc-confirm-btn" class="btn-primary" disabled>Далее →</button>
      </div>
    </div>

    <!-- Catalog -->
    <div id="main" class="hidden">
      <header>
        <button id="catalog-home-btn" class="header-back">← Главная</button>
        <span id="catalog-mode-label" style="font-size:15px;font-weight:600;flex:1;text-align:center;margin:0 8px"></span>
        <div id="cart-badge" class="hidden">
          <span id="cart-count">0</span> позиций
        </div>
      </header>
      <div id="location-strip" class="location-strip hidden"></div>

      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Поиск товара..." />
      </div>

      <div id="category-tabs"></div>
      <div id="catalog"></div>
    </div>

    <!-- Cart panel -->
    <div id="cart-panel" class="hidden fullscreen-panel">
      <div class="panel-header">
        <button id="back-btn">← Назад</button>
        <h2>Ваша заявка</h2>
      </div>
      <div id="cart-content"></div>
      <div id="cart-actions">
        <button id="send-orders-btn" class="btn-primary">Отправить поставщикам</button>
        <button id="clear-cart-btn" class="btn-secondary">Очистить</button>
      </div>
    </div>

    <!-- Order panel -->
    <div id="order-panel" class="hidden fullscreen-panel">
      <div class="panel-header">
        <button id="order-back-btn">← Назад</button>
        <h2>Заявка</h2>
      </div>
      <div id="order-list"></div>
      <div class="bottom-actions">
        <button id="done-btn" class="btn-primary">Готово ✓</button>
      </div>
    </div>

    <!-- Info screen -->
    <div id="info-screen" class="hidden fullscreen-panel">
      <div class="panel-header">
        <button id="info-back-btn">← Назад</button>
        <h2 id="info-screen-title">О десертах</h2>
      </div>
      <div class="search-bar-inner">
        <input type="text" id="info-search-input" placeholder="Поиск..." />
      </div>
      <div id="info-category-tabs"></div>
      <div id="info-catalog"></div>
    </div>

    <!-- Checklist screen -->
    <div id="checklist-screen" class="hidden fullscreen-panel">
      <div class="panel-header">
        <button id="checklist-back-btn">← Назад</button>
        <h2>Открытие смены</h2>
      </div>
      <p class="order-hint">Выберите точку:</p>
      <div id="checklist-location-list" style="padding:0 16px"></div>
      <p class="order-hint" id="checklist-score-label" style="padding-top:16px"></p>
      <div id="checklist-items" style="padding:0 16px 100px"></div>
      <div class="bottom-actions">
        <button id="checklist-submit-btn" class="btn-primary" disabled>Отправить отчёт</button>
      </div>
    </div>

    <!-- History screen -->
    <div id="history-screen" class="hidden fullscreen-panel">
      <div class="panel-header">
        <button id="history-back-btn">← Назад</button>
        <h2>История заказов</h2>
      </div>
      <div id="history-loading" class="hidden">
        <div class="spinner" style="margin:40px auto"></div>
      </div>
      <div id="history-list"></div>
    </div>

    <!-- Error -->
    <div id="error-screen" class="hidden">
      <div class="error-box">
        <p>⚠️ Ошибка загрузки каталога</p>
        <button onclick="loadCatalog()" class="btn-primary">Повторить</button>
      </div>
    </div>

  </div>

  <!-- Order type modal -->
  <div id="order-type-modal" class="hidden">
    <div class="modal-box">
      <div class="modal-title">Тип заявки</div>
      <button class="modal-btn modal-btn-tomorrow" onclick="confirmOrderType('tomorrow')">📅 Заявка на завтра</button>
      <button class="modal-btn modal-btn-today" onclick="confirmOrderType('today')">➕ Доп. заявка на сегодня</button>
      <button class="modal-btn modal-btn-cancel" onclick="cancelOrderType()">Отмена</button>
    </div>
  </div>

  <!-- FAB -->
  <div id="fab" class="hidden">
    <button id="fab-btn" onclick="openCart()">
      🛒 <span id="fab-count">0</span>
    </button>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="app.js?v=3"></script>
</body>
</html>
